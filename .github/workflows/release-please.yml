on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # this assumes that you have created a personal access token
          # (PAT) and configured it as a GitHub action secret named
          # `MY_RELEASE_PLEASE_TOKEN` (this secret name is not important).
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          # this is a built-in strategy in release-please, see "Action Inputs"
          # for more options
          release-type: node
          # One-time version skip: v0.7.0 was published on a since-abandoned
          # history (orphaned tag), so the next release must skip to 0.8.0.
          # REMOVE this line once v0.8.0 is tagged, or every release stays
          # pinned to 0.8.0.
          release-as: '0.8.0'
